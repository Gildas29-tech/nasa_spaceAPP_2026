[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldshift"
version = "0.1.0"
description = "NASA Space Apps 2026: Field Shift - Adapting Farms with NASA Data"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.7.4",
    "pydantic-settings==2.3.3",
    "python-dotenv==1.0.1",
    "earthaccess==0.1.3",
    "icepyx==0.9.0",
    "sliderule==0.22.0",
    "harmony-client==0.6.0",
    "s3fs==2024.6.0",
    "rasterio==1.3.10",
    "rioxarray==0.15.1",
    "xarray==2024.5.0",
    "geopandas==0.14.4",
    "shapely==2.0.4",
    "pyproj==3.6.1",
    "affine==2.4.0",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scipy==1.13.0",
    "scikit-learn==1.5.0",
    "scikit-image==0.23.2",
    "matplotlib==3.8.4",
    "seaborn==0.13.2",
    "plotly==5.22.0",
    "lightgbm==4.3.0",
    "xgboost==2.1.1",
    "optuna==3.6.1",
    "httpx==0.27.0",
    "aiohttp==3.9.4",
    "tenacity==8.3.0",
    "tqdm==4.66.4",
    "pyyaml==6.0.1",
    "click==8.1.7",
    "rich==13.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "black==24.4.2",
    "isort==5.13.2",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "pre-commit==3.7.1",
    "jupyter==1.0.0",
    "ipykernel==6.29.5",
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # function calls in default arguments
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["backend/app"]
omit = ["*/tests/*", "*/venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]